# BSL Router — Example Configuration / Cấu hình mẫu
# Copy this file to config.yaml and fill in your provider credentials.
# VN: Sao chép file này thành config.yaml và điền credentials của provider vào.
# See docs/CONFIGURATION.md for full documentation.
# VN: Xem docs/CONFIGURATION.md để có tài liệu đầy đủ.

tools:
  output_thinking_squeeze: false

upstream_stream_buffer:
  enabled: false

providers:
  openai-provider:
    type: custom
    format: openai
    connections:
    - enabled: true
      api_key: enc:YOUR_ENCRYPTED_API_KEY_HERE
      base_url: https://api.openai.com/v1
    models:
    - id: gpt-4o
      enabled: true
      thinking: auto
      reasoning_mode: standard
      reasoning_context: all_turns

combos:
- alias: Example-Combo
  chain:
  - provider: openai-provider
    model: gpt-4o
    thinking: auto
  strategy: fallback

aliases: {}

admin:
  password_enabled: false
  password: enc:YOUR_ENCRYPTED_ADMIN_PASSWORD_HERE

update:
  github_repo: ''
  check_enabled: true
  auto_check_interval: 300

antigravity_integration:
  enabled: false
  mappings: {}

# Google OAuth client credentials for the "antigravity" login flow. / Thông tin OAuth của Google cho luồng đăng nhập "antigravity".
# Not shipped with the project: these belong to Google's desktop client, and
# committing them would leak a third-party secret. Leave blank to disable the
# Antigravity login flow entirely; every other provider works without it.
#
# You may instead export these as environment variables, which take precedence:
#   BSL_ANTIGRAVITY_CLIENT_ID
#   BSL_ANTIGRAVITY_CLIENT_SECRET
# VN: Các thông tin này KHÔNG kèm theo project (secret của bên thứ ba); để trống
# để tắt luồng đăng nhập Antigravity — mọi provider khác vẫn hoạt động bình thường.
# Có thể dùng biến môi trường (ưu tiên cao hơn file config).
antigravity_oauth:
  client_id: ''
  client_secret: ''

# Shared Pool App Tier-2 inbound auth (Ed25519). / Xác thực đầu vào Tier-2 (Ed25519).
# Default OFF — zero behavior change for existing callers.
# Enable when this router is advertised as a pool peer's router_address.
#
# Signing contract (4 lines):
#   {METHOD} {path}\n{unix_ts}\n{router_address}\n{sha256(raw_body)}
# Headers on every signed Tier-2 POST:
#   X-BSL-Pool-From, X-BSL-Pool-Pubkey, X-BSL-Pool-Ts,
#   X-BSL-Pool-Sig, X-BSL-Pool-Body-Sha256
#
# mode=required REQUIRES:
#   - non-empty allowlist (pubkey hex of trusted Pool nodes)
#   - non-empty router_address (must match what Pool signs against)
# Config errors in required mode → 503 (fail-closed, never pass-through).
#
# VN: Xác thực Ed25519 cho lưu lượng Tier-2 từ Shared Pool App. Mặc định TẮT —
# không thay đổi hành vi của caller hiện tại; bật khi router này được cấu hình làm
# router_address của một peer. mode=required bắt buộc allowlist + router_address
# khác rỗng; lỗi config ở chế độ required → 503 (fail-closed, không pass-through).
pool_auth:
  enabled: false
  mode: optional          # optional | required
  replay_window_secs: 300
  # Must match the address peers sign against. Required when mode=required.
  router_address: ""
  # Pubkey hex allowlist. Required non-empty when mode=required.
  # Empty in optional mode = accept any valid signature.
  allowlist: []
