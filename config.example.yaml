# BSL Router — Example Configuration / Cấu hình mẫu
# Copy this file to config.yaml and fill in your provider credentials.
# VN: Sao chép file này thành config.yaml và điền credentials của provider vào.
# See docs/CONFIGURATION.md for full documentation.
# VN: Xem docs/CONFIGURATION.md để có tài liệu đầy đủ.

tools:
  output_thinking_squeeze: false
  # Provider-injection response guard (default OFF). When enabled, scans
  # assembled provider responses (stream + non-stream) for user-directed
  # exfiltration / code-execution injection and emits telemetry to
  # .brain/logs/response_guard.jsonl. mode log_only = observe, never mutate
  # (the only shipping mode; redact/block branches exist but are inert).
  response_guard:
    enabled: false
    mode: log_only
    max_chars: 16384

upstream_stream_buffer:
  enabled: false

providers:
  openai-provider:
    type: custom
    format: openai
    connections:
    - enabled: true
      api_key: enc:YOUR_ENCRYPTED_API_KEY_HERE
      base_url: https://api.openai.com/v1
    models:
    - id: gpt-4o
      enabled: true
      thinking: auto
      reasoning_mode: standard
      reasoning_context: all_turns

combos:
- alias: Example-Combo
  chain:
  - provider: openai-provider
    model: gpt-4o
    thinking: auto
  strategy: fallback

aliases: {}

admin:
  password_enabled: false
  password: enc:YOUR_ENCRYPTED_ADMIN_PASSWORD_HERE

update:
  github_repo: ''
  check_enabled: true
  auto_check_interval: 300

antigravity_integration:
  enabled: false
  mappings: {}

# Google OAuth client credentials for the "antigravity" login flow. / Thông tin OAuth của Google cho luồng đăng nhập "antigravity".
# Built-in Antigravity desktop OAuth credentials are used automatically when these
# fields are blank. Custom overrides in config.yaml or environment variables are
# optional and take precedence:
#   BSL_ANTIGRAVITY_CLIENT_ID
#   BSL_ANTIGRAVITY_CLIENT_SECRET
# VN: Credentials OAuth desktop Antigravity tích hợp sẵn sẽ được dùng tự động khi
# các trường này để trống. Có thể ghi đè tùy chọn trong config.yaml hoặc bằng biến
# môi trường (được ưu tiên hơn cấu hình file).
antigravity_oauth:
  client_id: ''
  client_secret: ''

# Shared Pool App Tier-2 inbound auth (Ed25519). / Xác thực đầu vào Tier-2 (Ed25519).
# Default OFF — zero behavior change for existing callers.
# Enable when this router is advertised as a pool peer's router_address.
#
# Signing contract (4 lines):
#   {METHOD} {path}\n{unix_ts}\n{router_address}\n{sha256(raw_body)}
# Headers on every signed Tier-2 POST:
#   X-BSL-Pool-From, X-BSL-Pool-Pubkey, X-BSL-Pool-Ts,
#   X-BSL-Pool-Sig, X-BSL-Pool-Body-Sha256
#
# mode=required REQUIRES:
#   - non-empty allowlist (pubkey hex of trusted Pool nodes)
#   - non-empty router_address (must match what Pool signs against)
# Config errors in required mode → 503 (fail-closed, never pass-through).
#
# VN: Xác thực Ed25519 cho lưu lượng Tier-2 từ Shared Pool App. Mặc định TẮT —
# không thay đổi hành vi của caller hiện tại; bật khi router này được cấu hình làm
# router_address của một peer. mode=required bắt buộc allowlist + router_address
# khác rỗng; lỗi config ở chế độ required → 503 (fail-closed, không pass-through).
pool_auth:
  enabled: false
  mode: optional          # optional | required
  replay_window_secs: 300
  # Must match the address peers sign against. Required when mode=required.
  router_address: ""
  # Pubkey hex allowlist. Required non-empty when mode=required.
  # Empty in optional mode = accept any valid signature.
  allowlist: []

# Model authenticity verification � probes upstream to verify claimed model identity
authenticity:
  enabled: false                    # master switch, default OFF
  cache_ttl_seconds: 1800           # 30 min - short because of source rotation
  max_tier: 2                       # P0: Tier 0+1+2
  fail_action: "block"              # block | warn
  suspect_action: "warn"            # warn
  probe_timeout_s: 30               # per-probe timeout
  total_timeout_s: 90               # full battery timeout
  v2_min_budget_s: 150              # deep mode: guaranteed floor for the v2 lanes (sibling splitter)
  deep_total_timeout_s: 480         # auto->deep escalation budget (full deep battery measured 262s)
  # Judge LLM grades T2.5 non-coding probes (creative/EQ/humor/design). PICK A FRONTIER
  # MODEL FROM A DIFFERENT FAMILY THAN THE SUSPECT - same-family judges bias scores.
  # Blank = Testing Tab asks the user to choose (never hardcoded; public repo).
  judge_model: ""
  judge_endpoint: ""
  judge_timeout_s: 180              # per judge call (noncoding grading + tie-break); some judges are slow
