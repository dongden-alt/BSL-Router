[pytest]
# Global timeout safety net: every test auto-fails at 10s unless marked otherwise
timeout = 10
timeout_method = thread

# Test markers for categorization
markers =
    slow: marks tests as slow (>10s runtime, deselect with '-m "not slow"')
    integration: marks tests requiring real I/O (subprocess, network, disk)
    unit: marks fast unit tests (default assumption)

# Test discovery
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --strict-markers
    --tb=short
    -v

# Ignore patterns
norecursedirs = .git .venv __pycache__ .pytest_cache .brain artifacts data docs scripts
