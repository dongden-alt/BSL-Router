name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.7)'
        required: true
        default: 'v1.0.7'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${TAG}"

      - name: Build release notes from CHANGELOG.md
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          python3 - "$VER" <<'PY'
          import re, sys
          ver = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              text = ""
          m = re.search(r"## \[%s\][^\n]*\n(.*?)(?=\n## \[|\Z)" % re.escape(ver), text, re.DOTALL)
          body = m.group(1).strip() if m else ""
          header = "# %s - see CHANGELOG.md\n\n" % ver
          notes = header + (body if body else "See CHANGELOG.md for details.")
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY

      - name: Publish release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
            exit 0
          fi
          gh release create "$TAG" --title "BSL Router ${TAG#v}" --notes-file notes.md --latest
