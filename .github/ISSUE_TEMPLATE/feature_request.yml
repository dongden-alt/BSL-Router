## Feature Description · Mô tả tính năng

A clear description of the feature you'd like to see. — Mô tả rõ ràng tính năng bạn muốn có.

## Problem · Vấn đề

What problem does this feature solve? (e.g., "I can't route to provider X because...") — Tính năng này giải quyết vấn đề gì?

## Proposed Solution · Giải pháp đề xuất

How you'd like this to work. — Bạn muốn nó hoạt động như thế nào.

## Alternatives Considered · Phương án thay thế

Any alternative solutions you've considered. — Các giải pháp thay thế bạn đã cân nhắc.

## Additional Context · Bối cảnh bổ sung

Any other context, screenshots, or references. — Bối cảnh khác, ảnh chụp màn hình hoặc liên kết tham chiếu.
